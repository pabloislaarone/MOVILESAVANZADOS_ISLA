name: Lab11Capturas
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: ../../app/SEMANA11/Actividad02_SwiftData/apple_lab11_02_SwiftUI_SwiftData/apple_lab11_02_SwiftUI_SwiftData
    settings:
      base:
        PRODUCT_NAME: apple_lab11_02_SwiftUI_SwiftData
        PRODUCT_BUNDLE_IDENTIFIER: com.isla.lab11-02-SwiftUI-SwiftData
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: App
    settings:
      base:
        TEST_TARGET_NAME: App
        PRODUCT_BUNDLE_IDENTIFIER: com.isla.lab11-02-UITests
schemes:
  Lab11:
    build:
      targets:
        App: all
        UITests: [test]
    test:
      targets: [UITests]
