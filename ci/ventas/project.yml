name: VentasCapturas
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Ventas:
    type: application
    platform: iOS
    sources:
      - path: ${SRC}/Ventas
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_NAME: Ventas
        PRODUCT_BUNDLE_IDENTIFIER: com.isla.ventas
        INFOPLIST_FILE: ${SRC}/Ventas/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ventas
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ventas
    settings:
      base:
        TEST_TARGET_NAME: Ventas
        PRODUCT_BUNDLE_IDENTIFIER: com.isla.ventas.uitests
schemes:
  Ventas:
    build:
      targets:
        Ventas: all
        UITests: [test]
    test:
      targets: [UITests]
